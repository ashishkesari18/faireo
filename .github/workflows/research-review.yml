name: research-review-checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  fast-review-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight audit dependencies
        run: python -m pip install numpy pandas scipy scikit-learn
      - name: Synthetic sensitivity and consistency tests
        run: python tests/test_review_pack.py
      - name: Check existing benchmark country-table invariants
        run: python scripts/verify_country_results.py --input results/countries_lgbm_country_s0.csv
      - name: Continent-blocked reliability stress test
        run: |
          python tests/test_geographic_stress.py
          python scripts/geographic_stress_test.py
      - name: Upload geographic stress-test results
        uses: actions/upload-artifact@v4
        with:
          name: continent-holdout-reliability
          path: |
            results/validation/continent_holdout_stress.json
            results/validation/continent_holdout_predictions.csv
